name: Poll SuperChat fallback

# 已經由 Cloudflare Worker（cloudflare/poll-superchat-worker.js）取代做自動排程；
# 留低 workflow_dispatch 淨係俾人手觸發，避免同 Cloudflare Worker 同時讀寫
# campaign 文件引發 race condition（互相覆蓋對方啱啱寫入嘅新記錄）。
on:
  workflow_dispatch: {}

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: scripts
        run: npm install

      - name: Poll SuperChat / membership gifts
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node poll-superchat.mjs
