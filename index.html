<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <title>加班台 Dashboard</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #F4F6F9; 
            color: #1A1A1A; 
            margin: 0; 
            padding: 20px 40px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* 頂部導航欄（參考圖風格） */
        .navbar {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #FFFFFF;
            padding: 12px 25px;
            border-radius: 50px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            margin-bottom: 30px;
        }
        .nav-logo {
            font-weight: bold;
            font-size: 18px;
            color: #1A1A1A;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .nav-links {
            display: flex;
            gap: 10px;
            background: #F4F6F9;
            padding: 4px;
            border-radius: 30px;
        }
        .nav-item {
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            color: #65676B;
            cursor: pointer;
            border: none;
            background: transparent;
        }
        .nav-item.active {
            background: #FFFFFF;
            color: #1A1A1A;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            font-weight: bold;
        }
        .nav-right-icons {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .icon-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #F4F6F9;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
        }
        .icon-btn.primary {
            background: #0066FF;
            color: #FFFFFF;
        }

        /* 主控台網格佈局（無大灰底托底） */
        .dashboard-grid {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 360px 320px 450px;
            gap: 25px;
        }

        /* 頂部入 Link 控制列 */
        .control-bar {
            grid-column: 1 / -1;
            background: #FFFFFF;
            padding: 15px 25px;
            border-radius: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            border: 1px solid #E4E6EB;
        }
        .control-bar input, .control-bar select {
            padding: 10px 15px;
            border-radius: 10px;
            border: 1px solid #E4E6EB;
            background: #F4F6F9;
            color: #1A1A1A;
            font-size: 13px;
            outline: none;
        }
        .control-bar input[type="text"] { flex: 2; }
        .control-bar select { flex: 1; }
        .control-bar button {
            padding: 10px 20px;
            border-radius: 10px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
        }

        /* 左側：倒數時鐘核心區 */
        .left-section {
            background: #FFFFFF;
            border-radius: 24px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            border: 1px solid #E4E6EB;
            text-align: center;
        }
        .timer-circle {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            border: 8px solid #1A1A1A;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #FFFFFF;
            box-shadow: inset 0 5px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        .timer-circle span {
            font-size: 28px;
            color: #1A1A1A;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .status-text {
            font-size: 13px;
            color: #65676B;
            margin-top: 10px;
        }

        /* 中間：日曆與時間區 */
        .middle-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .calendar-widget-split {
            background: #FFFFFF;
            padding: 15px;
            border-radius: 20px;
            border: 1px solid #E4E6EB;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .cal-month-box {
            background: #F4F6F9;
            padding: 15px 12px;
            border-radius: 14px;
            text-align: center;
            min-width: 90px;
            border: 1px solid #E4E6EB;
        }
        .cal-month-box .month-name {
            font-size: 14px;
            font-weight: bold;
            color: #1A1A1A;
            margin-top: 2px;
        }
        .cal-days-right {
            display: flex;
            gap: 5px;
            justify-content: space-between;
            flex-grow: 1;
        }
        .cal-day-item {
            text-align: center;
            padding: 8px 4px;
            border-radius: 12px;
            font-size: 10px;
            color: #65676B;
            background: #F4F6F9;
            flex: 1;
            border: 1px solid #E4E6EB;
        }
        .cal-day-item.active {
            background: #1A1A1A;
            color: #FFFFFF;
            font-weight: bold;
            border-color: #1A1A1A;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .cal-day-item.active .day-num {
            color: #FFFFFF;
        }
        .cal-day-item .day-num {
            font-size: 13px;
            font-weight: bold;
            color: #1A1A1A;
            margin-top: 3px;
        }

        .widget-box {
            background: #FFFFFF;
            padding: 22px;
            border-radius: 20px;
            border: 1px solid #E4E6EB;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            font-size: 13px;
            text-align: center;
        }

        /* 右側：Super Chat 排行榜 */
        .right-section {
            background: #FFFFFF;
            border-radius: 24px;
            padding: 22px;
            border: 1px solid #E4E6EB;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .right-section h3 {
            margin: 0 0 8px 0;
            color: #1A1A1A;
            font-size: 16px;
            text-align: center;
        }
        .sc-card {
            background: #F4F6F9;
            padding: 14px 18px;
            border-radius: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 5px solid #0066FF;
            border-top: 1px solid #E4E6EB;
            border-right: 1px solid #E4E6EB;
            border-bottom: 1px solid #E4E6EB;
        }
        .sc-name { font-weight: bold; font-size: 13px; color: #1A1A1A; }
        .sc-amount { color: #0066FF; font-weight: bold; font-size: 13px; }
    </style>
</head>
<body>

    <!-- 頂部導航列 (完美還原參考圖佈局) -->
    <div class="navbar">
        <div class="nav-logo">
            <span style="color: #0066FF; font-size: 20px;">✦</span> 加班台 Dashboard
        </div>
        <div class="nav-links">
            <button class="nav-item active">Dashboard</button>
            <button class="nav-item">Reports</button>
            <button class="nav-item">Calendar</button>
            <button class="nav-item">Chat</button>
            <button class="nav-item">Settings</button>
        </div>
        <div class="nav-right-icons">
            <button class="icon-btn">📞</button>
            <button class="icon-btn">🔔</button>
            <button class="icon-btn primary">👤</button>
        </div>
    </div>

    <!-- 主控台版面 (無大灰底托底) -->
    <div class="dashboard-grid">
        <!-- 頂部控制列：入 Link 區 -->
        <div class="control-bar">
            <input type="text" id="video_url" placeholder="請輸入 YouTube 直播 Link..." required>
            <select id="duration">
                <option value="2">2H</option>
                <option value="2.5">2.5H</option>
                <option value="3">3H</option>
                <option value="3.5">3.5H</option>
                <option value="4">4H</option>
                <option value="4.5" selected>4.5H</option>
            </select>
            <button type="button" onclick="startTimer()" style="background: #0066FF; color: #FFFFFF;">🚀 Start</button>
            <button type="button" onclick="resetTimer()" style="background: #F4F6F9; color: #1A1A1A; border: 1px solid #E4E6EB;">🔄 重設</button>
        </div>

        <!-- 左側：倒數時鐘 -->
        <div class="left-section">
            <div class="timer-circle">
                <span id="countdown">04:30:00</span>
                <span style="font-size: 11px; color: #65676B; margin-top: 5px;">倒數狀態</span>
            </div>
            <div class="status-text" id="statusBox">狀態：尚未綁定直播</div>
        </div>

        <!-- 中間：左月份、右日期列 + 香港即時時間 -->
        <div class="middle-section">
            <div class="calendar-widget-split">
                <div class="cal-month-box">
                    <div style="font-size: 10px; color: #65676B;">Month</div>
                    <div class="month-name" id="current-month-year">July</div>
                </div>
                <div class="cal-days-right" id="calendar-days-container">
                    <!-- 動態生成 7 日日期 -->
                </div>
            </div>

            <div class="widget-box">
                <h4 style="margin: 0 0 8px 0; color: #1A1A1A; font-size: 14px;">🇭🇰 香港即時時間</h4>
                <div style="font-weight: bold; color: #0066FF; font-size: 20px; letter-spacing: 1px;" id="hk-realtime">--:--:--</div>
                <div style="font-size: 11px; color: #65676B; margin-top: 4px;" id="hk-realdate">----/--/--</div>
            </div>
        </div>

        <!-- 右側：Super Chat 排行榜 -->
        <div class="right-section">
            <h3>🏆 Super Chat 排行榜</h3>
            <div class="sc-card">
                <span class="sc-name">1. Viewer_A</span>
                <span class="sc-amount">$HKD 500</span>
            </div>
            <div class="sc-card">
                <span class="sc-name">2. Fan_B</span>
                <span class="sc-amount">$HKD 320</span>
            </div>
            <div class="sc-card">
                <span class="sc-name">3. Supporter_C</span>
                <span class="sc-amount">$HKD 150</span>
            </div>
            <div style="text-align: center; font-size: 11px; color: #65676B; margin-top: auto;">等待實時 SC 接入...</div>
        </div>
    </div>

    <script>
        let targetEndTime = null;
        let timerInterval = null;

        function updateHKClockAndCalendar() {
            const now = new Date();
            const hkTimeStr = now.toLocaleString("en-US", { timeZone: "Asia/Hong_Kong" });
            const hkDate = new Date(hkTimeStr);

            // 更新香港即時時間
            document.getElementById("hk-realtime").innerText = hkDate.toTimeString().split(' ')[0];
            document.getElementById("hk-realdate").innerText = hkDate.toISOString().split('T')[0];

            // 月份名稱
            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            document.getElementById("current-month-year").innerText = monthNames[hkDate.getMonth()];

            // 渲染本週 7 日
            const container = document.getElementById("calendar-days-container");
            container.innerHTML = "";

            let currentDayOfWeek = hkDate.getDay();
            let sunday = new Date(hkDate);
            sunday.setDate(hkDate.getDate() - currentDayOfWeek);

            const dayNames = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
            
            for (let i = 0; i < 7; i++) {
                let d = new Date(sunday);
                d.setDate(sunday.getDate() + i);

                let isToday = d.toDateString() === hkDate.toDateString();
                
                let dayDiv = document.createElement("div");
                dayDiv.className = `cal-day-item ${isToday ? 'active' : ''}`;
                dayDiv.innerHTML = `
                    <div style="font-size: 9px;">${dayNames[i]}</div>
                    <div class="day-num">${String(d.getDate()).padStart(2, '0')}</div>
                `;
                container.appendChild(dayDiv);
            }
        }

        setInterval(updateHKClockAndCalendar, 1000);
        updateHKClockAndCalendar();

        function startTimer() {
            const videoUrl = document.getElementById("video_url").value;
            const statusBox = document.getElementById("statusBox");
            
            let videoId = "";
            if (videoUrl.includes("youtu.be/")) {
                videoId = videoUrl.split("youtu.be/")[1].split("?")[0];
            } else if (videoUrl.includes("watch?v=")) {
                videoId = videoUrl.split("watch?v=")[1].split("&")[0];
            }

            if (videoId) {
                statusBox.innerHTML = `狀態：已綁定 (${videoId})`;
            } else {
                statusBox.innerHTML = `狀態：❌ 連結格式錯誤`;
                return;
            }

            const hoursToAdd = parseFloat(document.getElementById("duration").value);
            const now = new Date().getTime();
            targetEndTime = now + (hoursToAdd * 60 * 60 * 1000);

            if (!timerInterval) {
                timerInterval = setInterval(updateCountdown, 1000);
            }
            updateCountdown();
        }

        function updateCountdown() {
            if (!targetEndTime) return;

            const now = new Date().getTime();
            const distance = targetEndTime - now;
            const countdownElem = document.getElementById("countdown");

            if (distance < 0) {
                const elapsed = Math.abs(distance);
                const hours = Math.floor((elapsed % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((elapsed % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((elapsed % (1000 * 60)) / 1000);
                countdownElem.innerHTML = `+${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            } else {
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);
                countdownElem.innerHTML = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            }
        }

        function resetTimer() {
            targetEndTime = null;
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            document.getElementById("countdown").innerHTML = "04:30:00";
            document.getElementById("statusBox").innerHTML = "狀態：已重設";
        }
    </script>
</body>
</html>
