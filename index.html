<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <title>加班台 Super Chat 記錄器</title>
    <style>
        /* 採用圖 1 嘅高級棕色系背景與米色主調 */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #9C5138; 
            color: #3b231b; 
            text-align: center; 
            padding-top: 40px; 
            margin: 0; 
        }
        .card { 
            background: #D0C9BA; 
            padding: 35px; 
            border-radius: 24px; 
            display: inline-block; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); 
            width: 420px; 
            text-align: left; 
        }
        h2 { 
            text-align: center; 
            color: #9C5138; 
            margin-top: 0; 
            font-size: 24px;
            letter-spacing: 1px;
        }
        label { 
            font-size: 13px; 
            color: #6a5d53; 
            display: block; 
            margin-top: 14px; 
            font-weight: bold; 
        }
        input[type="text"], input[type="date"], select { 
            width: 100%; 
            padding: 11px; 
            margin-top: 6px; 
            border-radius: 8px; 
            border: 1px solid #b5ab9d; 
            background: #e2dcd0; 
            color: #3b231b; 
            box-sizing: border-box; 
            font-size: 14px; 
            outline: none;
        }
        input:focus, select:focus {
            border-color: #9C5138;
        }
        button { 
            background: #9C5138; 
            color: #D0C9BA; 
            border: none; 
            padding: 12px; 
            width: 100%; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 15px; 
            margin-top: 18px; 
            transition: opacity 0.2s;
        }
        button:hover { 
            opacity: 0.85; 
        }
        .status { 
            margin-top: 15px; 
            color: #2e5a36; 
            font-size: 13px; 
            text-align: center; 
            background: #c3bcae; 
            padding: 10px; 
            border-radius: 8px; 
        }
        .timer-box { 
            background: #c3bcae; 
            padding: 15px; 
            border-radius: 10px; 
            text-align: center; 
            margin-top: 20px; 
            border: 1px solid #b5ab9d; 
        }
        .timer-box span { 
            font-size: 26px; 
            color: #9C5138; 
            font-weight: bold; 
            letter-spacing: 1.5px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>加班台控制台</h2>
        
        <form id="configForm" onsubmit="return false;">
            <label>YouTube 直播 Link：</label>
            <input type="text" id="video_url" placeholder="https://www.youtube.com/watch?v=..." required>
            
            <label>開始日期：</label>
            <input type="date" id="start_date" required>

            <label>基本開鐘數：</label>
            <select id="duration">
                <option value="2">2 小時 (2H)</option>
                <option value="2.5">2.5 小時 (2.5H)</option>
                <option value="3">3 小時 (3H)</option>
                <option value="3.5">3.5 小時 (3.5H)</option>
                <option value="4">4 小時 (4H)</option>
                <option value="4.5" selected>4.5 小時 (4.5H)</option>
            </select>
            
            <button type="button" onclick="startTimer()">🚀 Start 開始計時</button>
            <button type="button" onclick="resetTimer()" style="background: #7a6d63; margin-top: 8px;">🔄 重設狀態</button>
        </form>

        <div class="timer-box">
            <p style="margin: 0 0 5px 0; font-size: 12px; color: #6a5d53;">計時器狀態：</p>
            <span id="countdown">⏸️ 尚未按 Start</span>
        </div>

        <div class="status" id="statusBox">
            <p style="margin: 0;"><strong>狀態：</strong>尚未設定直播</p>
        </div>
    </div>

    <script>
        let targetEndTime = null;
        let timerInterval = null;

        function startTimer() {
            const videoUrl = document.getElementById("video_url").value;
            const statusBox = document.getElementById("statusBox");
            
            let videoId = "";
            if (videoUrl.includes("youtu.be/")) {
                videoId = videoUrl.split("youtu.be/")[1].split("?")[0];
            } else if (videoUrl.includes("watch?v=")) {
                videoId = videoUrl.split("watch?v=")[1].split("&")[0];
            }

            if (videoId) {
                statusBox.innerHTML = `<p style="margin: 0;"><strong>狀態：</strong>已綁定 (Video ID: ${videoId})</p>`;
            } else {
                statusBox.innerHTML = `<p style="margin: 0; color: #9c2c1e;"><strong>狀態：</strong>❌ 連結格式錯誤</p>`;
                return;
            }

            const hoursToAdd = parseFloat(document.getElementById("duration").value);
            const now = new Date().getTime();
            targetEndTime = now + (hoursToAdd * 60 * 60 * 1000);

            if (!timerInterval) {
                timerInterval = setInterval(updateCountdown, 1000);
            }
            updateCountdown();
        }

        function updateCountdown() {
            if (!targetEndTime) return;

            const now = new Date().getTime();
            const distance = targetEndTime - now;
            const countdownElem = document.getElementById("countdown");

            if (distance < 0) {
                const elapsed = Math.abs(distance);
                const hours = Math.floor((elapsed % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((elapsed % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((elapsed % (1000 * 60)) / 1000);
                countdownElem.innerHTML = `🔥 已超時 ${hours}時 ${minutes}分 ${seconds}秒`;
            } else {
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);
                countdownElem.innerHTML = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            }
        }

        function resetTimer() {
            targetEndTime = null;
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            document.getElementById("countdown").innerHTML = "⏸️ 尚未按 Start";
            document.getElementById("statusBox").innerHTML = `<p style="margin: 0;"><strong>狀態：</strong>已重設</p>`;
        }
    </script>
</body>
</html>
