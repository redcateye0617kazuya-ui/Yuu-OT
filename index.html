<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <title>加班台 Dashboard</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #9C5138; 
            color: #3b231b; 
            margin: 0; 
            padding: 30px; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .dashboard-container {
            background: #D0C9BA;
            width: 1050px;
            padding: 30px;
            border-radius: 28px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            display: grid;
            grid-template-columns: 360px 240px 360px;
            gap: 25px;
        }
        .header-top {
            grid-column: 1 / -1;
            background: #c3bcae;
            padding: 15px 20px;
            border-radius: 16px;
            display: flex;
            gap: 15px;
            align-items: center;
            border: 1px solid #b5ab9d;
        }
        .header-top input, .header-top select {
            padding: 9px 12px;
            border-radius: 8px;
            border: 1px solid #b5ab9d;
            background: #e2dcd0;
            color: #3b231b;
            font-size: 13px;
            outline: none;
        }
        .header-top input[type="text"] { flex: 2; }
        .header-top select { flex: 1; }
        .header-top button {
            padding: 9px 16px;
            border-radius: 8px;
            border: none;
            background: #9C5138;
            color: #D0C9BA;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
        }
        .header-top button:hover { opacity: 0.85; }

        /* 左側：倒數計時核心區（代替心臟位置） */
        .left-section {
            background: #c3bcae;
            border-radius: 20px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid #b5ab9d;
            text-align: center;
        }
        .timer-circle {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            border: 8px solid #9C5138;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #D0C9BA;
            box-shadow: inset 0 5px 15px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .timer-circle span {
            font-size: 28px;
            color: #9C5138;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .status-text {
            font-size: 13px;
            color: #6a5d53;
            margin-top: 10px;
        }

        /* 中間：日曆與控制狀態區 */
        .middle-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .widget-box {
            background: #c3bcae;
            padding: 18px;
            border-radius: 16px;
            border: 1px solid #b5ab9d;
            font-size: 13px;
        }
        .widget-box h4 {
            margin: 0 0 10px 0;
            color: #9C5138;
            font-size: 14px;
        }

        /* 右側：Super Chat 排行榜 */
        .right-section {
            background: #c3bcae;
            border-radius: 20px;
            padding: 20px;
            border: 1px solid #b5ab9d;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .right-section h3 {
            margin: 0 0 5px 0;
            color: #9C5138;
            font-size: 15px;
            text-align: center;
        }
        .sc-card {
            background: #D0C9BA;
            padding: 12px 15px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 5px solid #9C5138;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .sc-name { font-weight: bold; font-size: 13px; color: #3b231b; }
        .sc-amount { color: #9C5138; font-weight: bold; font-size: 13px; }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <!-- 頂部：入 Link 區 -->
        <div class="header-top">
            <input type="text" id="video_url" placeholder="YouTube 直播 Link..." required>
            <select id="duration">
                <option value="2">2H</option>
                <option value="2.5">2.5H</option>
                <option value="3">3H</option>
                <option value="3.5">3.5H</option>
                <option value="4">4H</option>
                <option value="4.5" selected>4.5H</option>
            </select>
            <button type="button" onclick="startTimer()" style="background: #2e5a36;">🚀 Start</button>
            <button type="button" onclick="resetTimer()" style="background: #9C5138;">🔄 重設</button>
        </div>

        <!-- 左側：倒數時鐘（代替心臟位置） -->
        <div class="left-section">
            <div class="timer-circle">
                <span id="countdown">04:30:00</span>
                <span style="font-size: 11px; color: #6a5d53; margin-top: 5px;">倒數狀態</span>
            </div>
            <div class="status-text" id="statusBox">狀態：尚未綁定直播</div>
        </div>

        <!-- 中間：日曆與系統資訊 -->
        <div class="middle-section">
            <div class="widget-box">
                <h4>📅 日曆檢視</h4>
                <div style="text-align: center; font-weight: bold; color: #3b231b; font-size: 15px;" id="current-date-display">2026-07-28</div>
                <div style="font-size: 11px; text-align: center; color: #6a5d53; margin-top: 5px;">今日開台排期中</div>
            </div>
            <div class="widget-box" style="flex-grow: 1;">
                <h4>⚙️ 系統狀態</h4>
                <p style="margin: 5px 0; color: #6a5d53;">連線：正常運作</p>
                <p style="margin: 5px 0; color: #6a5d53;">記錄模式：即時更新</p>
            </div>
        </div>

        <!-- 右側：Super Chat 排行榜 -->
        <div class="right-section">
            <h3>🏆 Super Chat 排行榜</h3>
            <div class="sc-card">
                <span class="sc-name">1. Viewer_A</span>
                <span class="sc-amount">$HKD 500</span>
            </div>
            <div class="sc-card">
                <span class="sc-name">2. Fan_B</span>
                <span class="sc-amount">$HKD 320</span>
            </div>
            <div class="sc-card">
                <span class="sc-name">3. Supporter_C</span>
                <span class="sc-amount">$HKD 150</span>
            </div>
            <div style="text-align: center; font-size: 11px; color: #6a5d53; margin-top: auto;">等待實時 SC 接入...</div>
        </div>
    </div>

    <script>
        let targetEndTime = null;
        let timerInterval = null;

        // 自動顯示今日日期
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('current-date-display').innerText = today;

        function startTimer() {
            const videoUrl = document.getElementById("video_url").value;
            const statusBox = document.getElementById("statusBox");
            
            let videoId = "";
            if (videoUrl.includes("youtu.be/")) {
                videoId = videoUrl.split("youtu.be/")[1].split("?")[0];
            } else if (videoUrl.includes("watch?v=")) {
                videoId = videoUrl.split("watch?v=")[1].split("&")[0];
            }

            if (videoId) {
                statusBox.innerHTML = `狀態：已綁定 (${videoId})`;
            } else {
                statusBox.innerHTML = `狀態：❌ 連結格式錯誤`;
                return;
            }

            const hoursToAdd = parseFloat(document.getElementById("duration").value);
            const now = new Date().getTime();
            targetEndTime = now + (hoursToAdd * 60 * 60 * 1000);

            if (!timerInterval) {
                timerInterval = setInterval(updateCountdown, 1000);
            }
            updateCountdown();
        }

        function updateCountdown() {
            if (!targetEndTime) return;

            const now = new Date().getTime();
            const distance = targetEndTime - now;
            const countdownElem = document.getElementById("countdown");

            if (distance < 0) {
                const elapsed = Math.abs(distance);
                const hours = Math.floor((elapsed % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((elapsed % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((elapsed % (1000 * 60)) / 1000);
                countdownElem.innerHTML = `+${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            } else {
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);
                countdownElem.innerHTML = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            }
        }

        function resetTimer() {
            targetEndTime = null;
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            document.getElementById("countdown").innerHTML = "04:30:00";
            document.getElementById("statusBox").innerHTML = "狀態：已重設";
        }
    </script>
</body>
</html>
