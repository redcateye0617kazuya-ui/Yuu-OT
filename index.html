<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <title>加班台 Super Chat 記錄器</title>
    <!-- CSS 樣式省略 -->
</head>
<body>
    <div class="card">
        <h2>加班台控制台</h2>
        
        <!-- 表單部分 -->
        <form method="POST" action="/update_config">
            <label>YouTube 直播 Link：</label>
            <input type="text" name="video_url" value="{{ video_url }}" placeholder="https://www.youtube.com/watch?v=..." required>
            
            <label>開始日期：</label>
            <input type="date" name="start_date" value="{{ start_date }}" required>
            
            <label>開台時間：</label>
            <input type="time" name="start_time" value="{{ start_time }}" required>
            
            <button type="submit" name="action" value="start" style="background: #2ed573; margin-top: 15px;">🚀 Start 開始計時</button>
            <button type="submit" name="action" value="reset" style="background: #ffa502; margin-top: 8px;">🔄 重設狀態</button>
        </form>

        <div class="timer-box">
            <p style="margin: 0 0 5px 0; font-size: 12px; color: #888;">計時器狀態：</p>
            <span id="countdown">計算中...</span>
        </div>

        <div class="status">
            <p style="margin: 0;"><strong>狀態：</strong>{{ chat_status }}</p>
        </div>
    </div>

    <!-- 👇 呢個位置（即係 </body> 之前），成段放落去： -->
    <script>
        const isStarted = {{ is_started }}; 

        function updateTimer() {
            const countdownElem = document.getElementById("countdown");

            if (!isStarted) {
                countdownElem.innerHTML = "⏸️ 尚未按 Start，等待中...";
                return;
            }

            const targetDateStr = "{{ start_date }}T{{ start_time }}:00";
            const targetTime = new Date(targetDateStr).getTime();
            const now = new Date().getTime();
            const distance = targetTime - now;

            if (distance < 0) {
                const elapsed = Math.abs(distance);
                const hours = Math.floor((elapsed % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((elapsed % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((elapsed % (1000 * 60)) / 1000);
                countdownElem.innerHTML = `🔥 已開台 ${hours}時 ${minutes}分 ${seconds}秒`;
            } else {
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);
                countdownElem.innerHTML = `⏳ 倒數 ${hours}時 ${minutes}分 ${seconds}秒`;
            }
        }

        setInterval(updateTimer, 1000);
        updateTimer();
    </script>
</body>
</html>
