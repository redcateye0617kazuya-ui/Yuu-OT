<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <title>加班台 Super Chat 記錄器</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #fff; text-align: center; padding-top: 30px; margin: 0; }
        .card { background: #1e1e1e; padding: 30px; border-radius: 12px; display: inline-block; box-shadow: 0 4px 20px rgba(0,0,0,0.6); width: 420px; text-align: left; }
        h2 { text-align: center; color: #ff4757; margin-top: 0; }
        label { font-size: 13px; color: #bbb; display: block; margin-top: 12px; font-weight: bold; }
        input[type="text"], input[type="date"], select { width: 100%; padding: 10px; margin-top: 5px; border-radius: 6px; border: 1px solid #444; background: #2a2a2a; color: #fff; box-sizing: border-box; font-size: 14px; }
        button { background: #ff4757; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 15px; margin-top: 15px; }
        button:hover { opacity: 0.9; }
        .status { margin-top: 15px; color: #2ed573; font-size: 13px; text-align: center; background: #252525; padding: 8px; border-radius: 5px; }
        .timer-box { background: #252525; padding: 12px; border-radius: 6px; text-align: center; margin-top: 15px; border: 1px solid #333; }
        .timer-box span { font-size: 18px; color: #ffa502; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>加班台控制台</h2>
        
        <form id="configForm" onsubmit="return false;">
            <label>YouTube 直播 Link：</label>
            <input type="text" id="video_url" placeholder="https://www.youtube.com/watch?v=..." required>
            
            <label>開始日期：</label>
            <input type="date" id="start_date" required>

            <label>基本開鐘數：</label>
            <select id="duration">
                <option value="2">2 小時 (2H)</option>
                <option value="2.5">2.5 小時 (2.5H)</option>
                <option value="3">3 小時 (3H)</option>
                <option value="3.5">3.5 小時 (3.5H)</option>
                <option value="4">4 小時 (4H)</option>
                <option value="4.5" selected>4.5 小時 (4.5H)</option>
            </select>
            
            <button type="button" onclick="startTimer()" style="background: #2ed573;">🚀 Start 開始計時</button>
            <button type="button" onclick="resetTimer()" style="background: #ffa502; margin-top: 8px;">🔄 重設狀態</button>
        </form>

        <div class="timer-box">
            <p style="margin: 0 0 5px 0; font-size: 12px; color: #888;">計時器狀態：</p>
            <span id="countdown">⏸️ 尚未按 Start，等待中...</span>
        </div>

        <div class="status" id="statusBox">
            <p style="margin: 0;"><strong>狀態：</strong>尚未設定直播</p>
        </div>
    </div>

    <script>
        let targetEndTime = null;
        let timerInterval = null;

        function startTimer() {
            const videoUrl = document.getElementById("video_url").value;
            const statusBox = document.getElementById("statusBox");
            
            let videoId = "";
            if (videoUrl.includes("youtu.be/")) {
                videoId = videoUrl.split("youtu.be/")[1].split("?")[0];
            } else if (videoUrl.includes("watch?v=")) {
                videoId = videoUrl.split("watch?v=")[1].split("&")[0];
            }

            if (videoId) {
                statusBox.innerHTML = `<p style="margin: 0;"><strong>狀態：</strong>已綁定 (Video ID: ${videoId})</p>`;
            } else {
                statusBox.innerHTML = `<p style="margin: 0; color: #ff4757;"><strong>狀態：</strong>❌ 連結格式錯誤</p>`;
                return;
            }

            const hoursToAdd = parseFloat(document.getElementById("duration").value);
            const now = new Date().getTime();
            targetEndTime = now + (hoursToAdd * 60 * 60 * 1000);

            if (!timerInterval) {
                timerInterval = setInterval(updateCountdown, 1000);
            }
            updateCountdown();
        }

        function updateCountdown() {
            if (!targetEndTime) return;

            const now = new Date().getTime();
            const distance = targetEndTime - now;
            const countdownElem = document.getElementById("countdown");

            if (distance < 0) {
                const elapsed = Math.abs(distance);
                const hours = Math.floor((elapsed % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((elapsed % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((elapsed % (1000 * 60)) / 1000);
                countdownElem.innerHTML = `🔥 已超時 ${hours}時 ${minutes}分 ${seconds}秒`;
            } else {
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);
                countdownElem.innerHTML = `⏳ 倒數 ${hours}時 ${minutes}分 ${seconds}秒`;
            }
        }

        function resetTimer() {
            targetEndTime = null;
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            document.getElementById("countdown").innerHTML = "⏸️ 尚未按 Start，等待中...";
            document.getElementById("statusBox").innerHTML = `<p style="margin: 0;"><strong>狀態：</strong>已重設</p>`;
        }
    </script>
</body>
</html>
