<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <title>雲端加班台 Dashboard</title>
    <!-- 引入 Firebase SDK (v10 模組化版本) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ==========================================
        // Firebase 設定配置
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyCO1i0d_c7EO4jonhTx7ylib2-xAEbLa5M",
            authDomain: "overtime-dashboard.firebaseapp.com",
            projectId: "overtime-dashboard",
            storageBucket: "overtime-dashboard.firebasestorage.app",
            messagingSenderId: "442932326873",
            appId: "1:442932326873:web:18a57cdfc48d31b62369c8"
        };

        // 初始化 Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 定義全域變數
        let timerInterval = null;
        const docRef = doc(db, "streams", "current_stream"); // 固定存在雲端的同一份直播紀錄

        // 頁面載入時，從雲端拉取最新資料
        window.addEventListener('DOMContentLoaded', async () => {
            setupRealtimeSync();
            updateHKClockAndCalendar();
            setInterval(updateHKClockAndCalendar, 1000);
        });

        // 實時監聽雲端資料 (確保 F5、開關網頁實時同步)
        function setupRealtimeSync() {
            onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    
                    // 填入 Link
                    if (data.videoUrl) {
                        document.getElementById('video_url').value = data.videoUrl;
                    }
                    
                    // 更新介面狀態
                    if (data.status === "running" || data.status === "paused") {
                        window.serverTargetEndTime = data.targetEndTime;
                        window.serverStartTime = data.startTime;
                        window.serverIsPaused = data.isPaused;
                        window.serverPausedRemaining = data.pausedRemainingMs || 0;
                        window.currentStreamId = data.streamId;

                        if (data.status === "running") {
                            document.getElementById("statusBox").innerHTML = `狀態：已綁定 (${data.videoId || 'Live'})`;
                            document.getElementById("pauseBtn").style.display = "inline-block";
                            document.getElementById("pauseBtn").innerText = "⏸️ 暫停";
                            document.getElementById("timerStateDesc").innerText = "雲端倒數中";
                            if (!timerInterval) {
                                timerInterval = setInterval(updateCountdown, 1000);
                            }
                        } else if (data.status === "paused") {
                            document.getElementById("statusBox").innerHTML = `狀態：已暫停`;
                            document.getElementById("pauseBtn").style.display = "inline-block";
                            document.getElementById("pauseBtn").innerText = "▶️ 繼續";
                            document.getElementById("timerStateDesc").innerText = "雲端已暫停";
                            if (timerInterval) {
                                clearInterval(timerInterval);
                                timerInterval = null;
                            }
                            displayPausedTime(data.pausedRemainingMs);
                        }
                    } else if (data.status === "cutoff" || data.status === "reset") {
                        resetUIState();
                        if (data.status === "cutoff") {
                            document.getElementById("timerStateDesc").innerText = "狀態：已 Cut Off 終止";
                        }
                    }

                    // 渲染 SC 榜
                    if (data.scEvents) {
                        renderSCards(data.scEvents);
                    }
                }
            });
        }

        // 開始計時 (寫入雲端)
        async function startTimer() {
            const videoUrl = document.getElementById("video_url").value;
            let videoId = "";
            if (videoUrl.includes("youtu.be/")) {
                videoId = videoUrl.split("youtu.be/")[1].split("?")[0];
            } else if (videoUrl.includes("watch?v=")) {
                videoId = videoUrl.split("watch?v=")[1].split("&")[0];
            }

            if (!videoId && !videoUrl) {
                alert("❌ 請輸入有效的 YouTube 連結！");
                return;
            }

            const hoursToAdd = parseFloat(document.getElementById("duration").value);
            const now = Date.now();
            const targetEndTime = now + (hoursToAdd * 60 * 60 * 1000);
            const streamId = now;

            // 模擬初始 SC 數據
            const scEvents = [];

            // 寫入雲端 Firestore 資料庫
            await setDoc(docRef, {
                videoUrl: videoUrl,
                videoId: videoId,
                startTime: now,
                targetEndTime: targetEndTime,
                status: "running",
                isPaused: false,
                pausedRemainingMs: 0,
                streamId: streamId,
                scEvents: scEvents
            });

            alert("🚀 成功啟動雲端計時！現在你可以隨時 F5、關閉網頁甚至關機，雲端時間依然持續準確。");
        }

        // 暫停/繼續
        async function togglePauseTimer() {
            const snap = await getDoc(docRef);
            if (!snap.exists()) return;
            const data = snap.data();

            if (!data.isPaused) {
                // 進入暫停：計算當前剩餘毫秒數
                const remaining = data.targetEndTime - Date.now();
                await updateDoc(docRef, {
                    status: "paused",
                    isPaused: true,
                    pausedRemainingMs: remaining > 0 ? remaining : 0
                });
            } else {
                // 恢復計時：重新計算新的目標結束時間
                const newTarget = Date.now() + data.pausedRemainingMs;
                await updateDoc(docRef, {
                    status: "running",
                    isPaused: false,
                    targetEndTime: newTarget,
                    pausedRemainingMs: 0
                });
            }
        }

        // Cut Off
        async function cutOffTimer() {
            if (confirm("✂️ 確定要執行 Cut Off 立即終止倒數嗎？")) {
                await updateDoc(docRef, {
                    status: "cutoff",
                    targetEndTime: Date.now(),
                    isPaused: false
                });
            }
        }

        // 重設
        async function resetTimer() {
            if (confirm("🔄 確定要重設計時嗎？")) {
                await setDoc(docRef, {
                    status: "reset",
                    videoUrl: "",
                    targetEndTime: Date.now(),
                    scEvents: []
                });
            }
        }

        function resetUIState() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            document.getElementById("countdown").innerHTML = "04:30:00";
            document.getElementById("timerStateDesc").innerText = "雲端待機中";
            document.getElementById("elapsedBox").innerText = "總直播累積：00:00:00";
            document.getElementById("statusBox").innerHTML = "狀態：未開始";
            document.getElementById("pauseBtn").style.display = "none";
            document.getElementById("scCardListContainer").innerHTML = `<div style="text-align: center; color: #65676B; font-size: 12px;">暫無 SC 紀錄</div>`;
            document.getElementById("totalScBadge").innerText = "總計: $HKD 0";
        }

        function displayPausedTime(ms) {
            if (ms < 0) ms = 0;
            const hours = Math.floor((ms % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((ms % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((ms % (1000 * 60)) / 1000);
            document.getElementById("countdown").innerHTML = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        // 每秒更新畫面上的倒數與累積時間
        function updateCountdown() {
            if (!window.serverTargetEndTime || window.serverIsPaused) return;

            const now = Date.now();
            const elapsedMs = now - window.serverStartTime;
            
            // 計算累積時間
            const elHours = Math.floor((elapsedMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const elMinutes = Math.floor((elapsedMs % (1000 * 60 * 60)) / (1000 * 60));
            const elSeconds = Math.floor((elapsedMs % (1000 * 60)) / 1000);
            document.getElementById("elapsedBox").innerText = `總直播累積：${String(elHours).padStart(2, '0')}:${String(elMinutes).padStart(2, '0')}:${String(elSeconds).padStart(2, '0')}`;

            // 計算剩餘時間
            const distance = window.serverTargetEndTime - now;
            const countdownElem = document.getElementById("countdown");

            if (distance < 0) {
                const elapsed = Math.abs(distance);
                const h = Math.floor((elapsed % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((elapsed % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((elapsed % (1000 * 60)) / 1000);
                countdownElem.innerHTML = `+${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            } else {
                const h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((distance % (1000 * 60)) / 1000);
                countdownElem.innerHTML = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            }
        }

        function renderSCards(scEvents) {
            const container = document.getElementById("scCardListContainer");
            container.innerHTML = "";
            let total = 0;

            if (!scEvents || scEvents.length === 0) {
                container.innerHTML = `<div style="text-align: center; color: #65676B; font-size: 12px;">暫無 SC 紀錄</div>`;
                document.getElementById("totalScBadge").innerText = "總計: $HKD 0";
                return;
            }

            scEvents.forEach(sc => {
                total += parseFloat(sc.amount) || 0;
                let card = document.createElement("div");
                card.className = "sc-card";
                card.innerHTML = `
                    <span class="sc-name">${sc.name}</span>
                    <span class="sc-amount">$HKD ${sc.amount}</span>
                `;
                container.appendChild(card);
            });
            document.getElementById("totalScBadge").innerText = `總計: $HKD ${total}`;
        }

        function updateHKClockAndCalendar() {
            const now = new Date();
            const hkTimeStr = now.toLocaleString("en-US", { timeZone: "Asia/Hong_Kong" });
            const hkDate = new Date(hkTimeStr);

            document.getElementById("hk-realtime").innerText = hkDate.toTimeString().split(' ')[0];
            document.getElementById("hk-realdate").innerText = hkDate.toISOString().split('T')[0];

            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            document.getElementById("current-month-year").innerText = monthNames[hkDate.getMonth()];

            const container = document.getElementById("calendar-days-container");
            if (container) {
                container.innerHTML = "";
                let currentDayOfWeek = hkDate.getDay();
                let sunday = new Date(hkDate);
                sunday.setDate(hkDate.getDate() - currentDayOfWeek);
                const dayNames = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
                for (let i = 0; i < 7; i++) {
                    let d = new Date(sunday);
                    d.setDate(sunday.getDate() + i);
                    let isToday = d.toDateString() === hkDate.toDateString();
                    let dayDiv = document.createElement("div");
                    dayDiv.className = `cal-day-item ${isToday ? 'active' : ''}`;
                    dayDiv.innerHTML = `
                        <div style="font-size: 9px;">${dayNames[i]}</div>
                        <div class="day-num">${String(d.getDate()).padStart(2, '0')}</div>
                    `;
                    container.appendChild(dayDiv);
                }
            }
        }

        // ==========================================
        // 關鍵：將所有函數手動掛載到 window，令按鈕 onclick 生效
        // ==========================================
        window.startTimer = startTimer;
        window.togglePauseTimer = togglePauseTimer;
        window.cutOffTimer = cutOffTimer;
        window.resetTimer = resetTimer;
    </script>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #F4F6F9; color: #1A1A1A; margin: 0; padding: 20px 40px; 
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }
        .navbar {
            width: 100%; max-width: 1200px; display: flex; justify-content: space-between; align-items: center;
            background: #FFFFFF; padding: 12px 25px; border-radius: 50px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); margin-bottom: 30px;
        }
        .nav-logo { font-weight: bold; font-size: 18px; color: #1A1A1A; display: flex; align-items: center; gap: 8px; }
        .dashboard-grid { width: 100%; max-width: 1200px; display: grid; grid-template-columns: 360px 320px 450px; gap: 25px; }
        .control-bar {
            grid-column: 1 / -1; background: #FFFFFF; padding: 15px 25px; border-radius: 20px;
            display: flex; gap: 15px; align-items: center; box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid #E4E6EB; flex-wrap: wrap;
        }
        .control-bar input, .control-bar select {
            padding: 10px 15px; border-radius: 10px; border: 1px solid #E4E6EB; background: #F4F6F9; color: #1A1A1A; font-size: 13px; outline: none;
        }
        .control-bar input[type="text"] { flex: 2; min-width: 200px; }
        .control-bar select { flex: 1; }
        .control-bar button { padding: 10px 16px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; font-size: 13px; }
        .left-section {
            background: #FFFFFF; border-radius: 24px; padding: 30px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid #E4E6EB; text-align: center;
        }
        .timer-circle {
            width: 220px; height: 220px; border-radius: 50%; border: 8px solid #1A1A1A;
            display: flex; flex-direction: column; align-items: center; justify-content: center; background: #FFFFFF;
            box-shadow: inset 0 5px 15px rgba(0,0,0,0.05); margin-bottom: 15px;
        }
        .timer-circle span { font-size: 26px; color: #1A1A1A; font-weight: bold; letter-spacing: 1px; }
        .status-text { font-size: 13px; color: #65676B; margin-top: 5px; }
        .elapsed-text { font-size: 12px; color: #0066FF; font-weight: bold; margin-top: 8px; }
        .middle-section { display: flex; flex-direction: column; gap: 20px; }
        .calendar-widget-split {
            background: #FFFFFF; padding: 15px; border-radius: 20px; border: 1px solid #E4E6EB;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03); display: flex; align-items: center; gap: 12px;
        }
        .cal-month-box { background: #F4F6F9; padding: 15px 12px; border-radius: 14px; text-align: center; min-width: 90px; border: 1px solid #E4E6EB; }
        .cal-month-box .month-name { font-size: 14px; font-weight: bold; color: #1A1A1A; margin-top: 2px; }
        .cal-days-right { display: flex; gap: 5px; justify-content: space-between; flex-grow: 1; }
        .cal-day-item {
            text-align: center; padding: 8px 4px; border-radius: 12px; font-size: 10px; color: #65676B;
            background: #F4F6F9; flex: 1; border: 1px solid #E4E6EB;
        }
        .cal-day-item.active { background: #1A1A1A; color: #FFFFFF; font-weight: bold; border-color: #1A1A1A; }
        .cal-day-item .day-num { font-size: 13px; font-weight: bold; color: #1A1A1A; margin-top: 3px; }
        .cal-day-item.active .day-num { color: #FFFFFF; }
        .widget-box { background: #FFFFFF; padding: 22px; border-radius: 20px; border: 1px solid #E4E6EB; box-shadow: 0 4px 20px rgba(0,0,0,0.03); text-align: center; }
        .right-section {
            background: #FFFFFF; border-radius: 24px; padding: 22px; border: 1px solid #E4E6EB;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03); display: flex; flex-direction: column; gap: 12px;
        }
        .right-section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .right-section h3 { margin: 0; color: #1A1A1A; font-size: 15px; }
        .total-sc-badge { background: #E8F0FE; color: #0066FF; font-size: 11px; font-weight: bold; padding: 4px 8px; border-radius: 8px; }
        .sc-card {
            background: #F4F6F9; padding: 14px 18px; border-radius: 14px; display: flex; justify-content: space-between;
            align-items: center; border-left: 5px solid #0066FF; border: 1px solid #E4E6EB;
        }
        .sc-name { font-weight: bold; font-size: 13px; color: #1A1A1A; }
        .sc-amount { color: #0066FF; font-weight: bold; font-size: 13px; }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="nav-logo">
            <span style="color: #0066FF; font-size: 20px;">✦</span> 雲端加班台 Dashboard
        </div>
        <div style="font-size: 12px; color: #65676B;">🔥 雲端同步模式：支援 20 日超長續航、F5 零丟失</div>
    </div>

    <div class="dashboard-grid">
        <!-- 頂部控制列 -->
        <div class="control-bar">
            <input type="text" id="video_url" placeholder="請輸入 YouTube 直播 Link..." required>
            <select id="duration">
                <option value="2">2H</option>
                <option value="2.5">2.5H</option>
                <option value="3">3H</option>
                <option value="3.5">3.5H</option>
                <option value="4">4H</option>
                <option value="4.5" selected>4.5H</option>
                <option value="480">480H (20日測試)</option>
            </select>
            <button type="button" onclick="startTimer()" style="background: #0066FF; color: #FFFFFF;">🚀 Start</button>
            <button type="button" id="pauseBtn" onclick="togglePauseTimer()" style="background: #FF9500; color: #FFFFFF; display: none;">⏸️ 暫停</button>
            <button type="button" onclick="cutOffTimer()" style="background: #5856D6; color: #FFFFFF;">✂️ Cut Off</button>
            <button type="button" onclick="resetTimer()" style="background: #F4F6F9; color: #1A1A1A; border: 1px solid #E4E6EB;">🔄 重設</button>
        </div>

        <!-- 左側：倒數時鐘 -->
        <div class="left-section">
            <div class="timer-circle">
                <span id="countdown">04:30:00</span>
                <span style="font-size: 11px; color: #65676B; margin-top: 4px;" id="timerStateDesc">雲端待機中</span>
            </div>
            <div class="elapsed-text" id="elapsedBox">總直播累積：00:00:00</div>
            <div class="status-text" id="statusBox">狀態：未開始</div>
        </div>

        <!-- 中間：日曆與時間 -->
        <div class="middle-section">
            <div class="calendar-widget-split">
                <div class="cal-month-box">
                    <div style="font-size: 10px; color: #65676B;">Month</div>
                    <div class="month-name" id="current-month-year">July</div>
                </div>
                <div class="cal-days-right" id="calendar-days-container"></div>
            </div>

            <div class="widget-box">
                <h4 style="margin: 0 0 8px 0; color: #1A1A1A; font-size: 14px;">🇭🇰 香港即時時間</h4>
                <div style="font-weight: bold; color: #0066FF; font-size: 20px; letter-spacing: 1px;" id="hk-realtime">--:--:--</div>
                <div style="font-size: 11px; color: #65676B; margin-top: 4px;" id="hk-realdate">----/--/--</div>
            </div>
        </div>

        <!-- 右側：SC 排行榜 -->
        <div class="right-section">
            <div class="right-section-header">
                <h3>🏆 雲端 SC 排行榜</h3>
                <div class="total-sc-badge" id="totalScBadge">總計: $HKD 0</div>
            </div>
            <div id="scCardListContainer" style="display: flex; flex-direction: column; gap: 8px;">
                <div style="text-align: center; color: #65676B; font-size: 12px; padding: 20px;">暫無 SC 紀錄</div>
            </div>
            <div style="text-align: center; font-size: 11px; color: #65676B; margin-top: auto;">連線狀態：雲端實時同步中 🟢</div>
        </div>
    </div>

</body>
</html>
