<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <title>加班台 Dashboard</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #9C5138; 
            color: #3b231b; 
            margin: 0; 
            padding: 30px; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .dashboard-container {
            background: #D0C9BA;
            width: 1100px;
            padding: 30px;
            border-radius: 28px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            display: grid;
            grid-template-columns: 350px 300px 350px;
            gap: 25px;
        }
        .header-top {
            grid-column: 1 / -1;
            background: #c3bcae;
            padding: 15px 20px;
            border-radius: 16px;
            display: flex;
            gap: 15px;
            align-items: center;
            border: 1px solid #b5ab9d;
        }
        .header-top input, .header-top select {
            padding: 9px 12px;
            border-radius: 8px;
            border: 1px solid #b5ab9d;
            background: #e2dcd0;
            color: #3b231b;
            font-size: 13px;
            outline: none;
        }
        .header-top input[type="text"] { flex: 2; }
        .header-top select { flex: 1; }
        .header-top button {
            padding: 9px 16px;
            border-radius: 8px;
            border: none;
            background: #9C5138;
            color: #D0C9BA;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
        }
        .header-top button:hover { opacity: 0.85; }

        /* 左側：倒數時鐘核心區 */
        .left-section {
            background: #c3bcae;
            border-radius: 20px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid #b5ab9d;
            text-align: center;
        }
        .timer-circle {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            border: 8px solid #9C5138;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #D0C9BA;
            box-shadow: inset 0 5px 15px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .timer-circle span {
            font-size: 28px;
            color: #9C5138;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .status-text {
            font-size: 13px;
            color: #6a5d53;
            margin-top: 10px;
        }

        /* 中間：日曆與香港時間區改為左右結構 */
        .middle-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .calendar-widget-split {
            background: #c3bcae;
            padding: 12px;
            border-radius: 16px;
            border: 1px solid #b5ab9d;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .cal-month-box {
            background: #D0C9BA;
            padding: 15px 10px;
            border-radius: 12px;
            text-align: center;
            min-width: 85px;
            border: 1px solid #b5ab9d;
        }
        .cal-month-box .month-name {
            font-size: 14px;
            font-weight: bold;
            color: #9C5138;
        }
        .cal-days-right {
            display: flex;
            gap: 4px;
            justify-content: space-between;
            flex-grow: 1;
        }
        .cal-day-item {
            text-align: center;
            padding: 6px 3px;
            border-radius: 10px;
            font-size: 10px;
            color: #6a5d53;
            background: #D0C9BA;
            flex: 1;
        }
        .cal-day-item.active {
            background: #9C5138;
            color: #D0C9BA;
            font-weight: bold;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        .cal-day-item.active .day-num {
            color: #D0C9BA;
        }
        .cal-day-item .day-num {
            font-size: 12px;
            font-weight: bold;
            color: #3b231b;
            margin-top: 2px;
        }

        .widget-box {
            background: #c3bcae;
            padding: 18px;
            border-radius: 16px;
            border: 1px solid #b5ab9d;
            font-size: 13px;
            text-align: center;
        }

        /* 右側：Super Chat 排行榜 */
        .right-section {
            background: #c3bcae;
            border-radius: 20px;
            padding: 20px;
            border: 1px solid #b5ab9d;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .right-section h3 {
            margin: 0 0 5px 0;
            color: #9C5138;
            font-size: 15px;
            text-align: center;
        }
        .sc-card {
            background: #D0C9BA;
            padding: 12px 15px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 5px solid #9C5138;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .sc-name { font-weight: bold; font-size: 13px; color: #3b231b; }
        .sc-amount { color: #9C5138; font-weight: bold; font-size: 13px; }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <!-- 頂部：入 Link 區 -->
        <div class="header-top">
            <input type="text" id="video_url" placeholder="YouTube 直播 Link..." required>
            <select id="duration">
                <option value="2">2H</option>
                <option value="2.5">2.5H</option>
                <option value="3">3H</option>
                <option value="3.5">3.5H</option>
                <option value="4">4H</option>
                <option value="4.5" selected>4.5H</option>
            </select>
            <button type="button" onclick="startTimer()" style="background: #2e5a36;">🚀 Start</button>
            <button type="button" onclick="resetTimer()" style="background: #9C5138;">🔄 重設</button>
        </div>

        <!-- 左側：倒數時鐘 -->
        <div class="left-section">
            <div class="timer-circle">
                <span id="countdown">04:30:00</span>
                <span style="font-size: 11px; color: #6a5d53; margin-top: 5px;">倒數狀態</span>
            </div>
            <div class="status-text" id="statusBox">狀態：尚未綁定直播</div>
        </div>

        <!-- 中間：左月份、右日期列 + 香港即時時間 -->
        <div class="middle-section">
            <div class="calendar-widget-split">
                <div class="cal-month-box">
                    <div style="font-size: 10px; color: #6a5d53;">Month</div>
                    <div class="month-name" id="current-month-year">July</div>
                </div>
                <div class="cal-days-right" id="calendar-days-container">
                    <!-- 動態生成 7 日日期 -->
                </div>
            </div>

            <div class="widget-box">
                <h4 style="margin: 0 0 5px 0; color: #9C5138; font-size: 13px;">🇭🇰 香港即時時間</h4>
                <div style="font-weight: bold; color: #3b231b; font-size: 18px; letter-spacing: 1px;" id="hk-realtime">--:--:--</div>
                <div style="font-size: 11px; color: #6a5d53; margin-top: 3px;" id="hk-realdate">----/--/--</div>
            </div>
        </div>

        <!-- 右側：Super Chat 排行榜 -->
        <div class="right-section">
            <h3>🏆 Super Chat 排行榜</h3>
            <div class="sc-card">
                <span class="sc-name">1. Viewer_A</span>
                <span class="sc-amount">$HKD 500</span>
            </div>
            <div class="sc-card">
                <span class="sc-name">2. Fan_B</span>
                <span class="sc-amount">$HKD 320</span>
            </div>
            <div class="sc-card">
                <span class="sc-name">3. Supporter_C</span>
                <span class="sc-amount">$HKD 150</span>
            </div>
            <div style="text-align: center; font-size: 11px; color: #6a5d53; margin-top: auto;">等待實時 SC 接入...</div>
        </div>
    </div>

    <script>
        let targetEndTime = null;
        let timerInterval = null;

        function updateHKClockAndCalendar() {
            const now = new Date();
            const hkTimeStr = now.toLocaleString("en-US", { timeZone: "Asia/Hong_Kong" });
            const hkDate = new Date(hkTimeStr);

            // 更新香港即時時間
            document.getElementById("hk-realtime").innerText = hkDate.toTimeString().split(' ')[0];
            document.getElementById("hk-realdate").innerText = hkDate.toISOString().split('T')[0];

            // 月份名稱
            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            document.getElementById("current-month-year").innerText = monthNames[hkDate.getMonth()];

            // 渲染本週 7 日 (以當前星期日到星期六為一列)
            const container = document.getElementById("calendar-days-container");
            container.innerHTML = "";

            let currentDayOfWeek = hkDate.getDay();
            let sunday = new Date(hkDate);
            sunday.setDate(hkDate.getDate() - currentDayOfWeek);

            const dayNames = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
            
            for (let i = 0; i < 7; i++) {
                let d = new Date(sunday);
                d.setDate(sunday.getDate() + i);

                let isToday = d.toDateString() === hkDate.toDateString();
                
                let dayDiv = document.createElement("div");
                dayDiv.className = `cal-day-item ${isToday ? 'active' : ''}`;
                dayDiv.innerHTML = `
                    <div style="font-size: 9px;">${dayNames[i]}</div>
                    <div class="day-num">${String(d.getDate()).padStart(2, '0')}</div>
                `;
                container.appendChild(dayDiv);
            }
        }

        setInterval(updateHKClockAndCalendar, 1000);
        updateHKClockAndCalendar();

        function startTimer() {
            const videoUrl = document.getElementById("video_url").value;
            const statusBox = document.getElementById("statusBox");
            
            let videoId = "";
            if (videoUrl.includes("youtu.be/")) {
                videoId = videoUrl.split("youtu.be/")[1].split("?")[0];
            } else if (videoUrl.includes("watch?v=")) {
                videoId = videoUrl.split("watch?v=")[1].split("&")[0];
            }

            if (videoId) {
                statusBox.innerHTML = `狀態：已綁定 (${videoId})`;
            } else {
                statusBox.innerHTML = `狀態：❌ 連結格式錯誤`;
                return;
            }

            const hoursToAdd = parseFloat(document.getElementById("duration").value);
            const now = new Date().getTime();
            targetEndTime = now + (hoursToAdd * 60 * 60 * 1000);

            if (!timerInterval) {
                timerInterval = setInterval(updateCountdown, 1000);
            }
            updateCountdown();
        }

        function updateCountdown() {
            if (!targetEndTime) return;

            const now = new Date().getTime();
            const distance = targetEndTime - now;
            const countdownElem = document.getElementById("countdown");

            if (distance < 0) {
                const elapsed = Math.abs(distance);
                const hours = Math.floor((elapsed % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((elapsed % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((elapsed % (1000 * 60)) / 1000);
                countdownElem.innerHTML = `+${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            } else {
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);
                countdownElem.innerHTML = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            }
        }

        function resetTimer() {
            targetEndTime = null;
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            document.getElementById("countdown").innerHTML = "04:30:00";
            document.getElementById("statusBox").innerHTML = "狀態：已重設";
        }
    </script>
</body>
</html>
