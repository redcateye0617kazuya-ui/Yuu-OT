<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>YUU又又又OT Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="app.js"></script>
</head>
<body>

    <div class="app-shell">
        <header class="topbar">
            <div class="topbar-logo">
                <span class="logo-dots"><span></span><span></span><span></span><span></span></span>
                YUU又又又OT
            </div>
            <nav class="topbar-nav">
                <button class="tab-btn active" data-tab="dashboard" data-title="主控台">主控台</button>
                <button class="tab-btn" data-tab="record" data-title="Record / Report">Record / Report</button>
                <button class="tab-btn" data-tab="rule" data-title="Rule Setting">Rule Setting</button>
                <button class="tab-btn" data-tab="wheel" data-title="輪盤">輪盤</button>
            </nav>
            <button type="button" id="resetBtn" class="topbar-reset">重設馬拉松</button>
        </header>

        <div class="presence-bar" id="presenceBar"></div>

        <main class="main-content">
            <!-- ============ Dashboard ============ -->
            <div class="page-view dashboard-grid" id="dashboardView">
                <div class="panel stat-card stat-card-teal" style="grid-area: stat1;">
                    <div class="stat-label">SuperChat 金額</div>
                    <div class="stat-value" id="statScTotal">$0</div>
                    <div class="stat-updated" id="statScUpdated">--</div>
                </div>
                <div class="panel stat-card stat-card-gold" style="grid-area: stat2;">
                    <div class="stat-label">PayMe 已收</div>
                    <div class="stat-value" id="statPaymeTotal">$0</div>
                    <div class="stat-updated" id="statPaymeUpdated">--</div>
                </div>
                <div class="panel stat-card stat-card-slate" style="grid-area: stat3;">
                    <div class="stat-label">未抽輪盤次數</div>
                    <div class="stat-value" id="statPendingSpins">0</div>
                    <div class="stat-updated" id="statPendingSpinsUpdated">--</div>
                </div>
                <div class="panel stat-card stat-card-taupe" style="grid-area: stat4;">
                    <div class="stat-label">累積直播時數</div>
                    <div class="stat-value" id="statLiveHours">0H</div>
                    <div class="stat-updated" id="statLiveHoursUpdated">--</div>
                </div>

                <div class="panel timer-panel" style="grid-area: timer;">
                    <h3>剩餘加班時間</h3>
                    <div class="timer-display" id="countdown">--:--:--</div>
                    <div class="status-text" id="statusBox">狀態：未開始</div>
                    <div class="time-adjust-row">
                        <button type="button" class="time-adjust-btn" data-delta-ms="-3600000">-1H</button>
                        <button type="button" class="time-adjust-btn" data-delta-ms="-600000">-10M</button>
                        <button type="button" class="time-adjust-btn" data-delta-ms="600000">+10M</button>
                        <button type="button" class="time-adjust-btn" data-delta-ms="3600000">+1H</button>
                    </div>
                    <div class="time-info-box" id="startTimeBox">開始時間：--</div>
                    <div class="time-info-box" id="endTimeBox">收工時間：--</div>
                </div>

                <div class="panel" style="grid-area: board;">
                    <h3>金主榜 <span class="panel-subtitle">依總金額排名</span></h3>
                    <div id="scLeaderboard"><div class="empty-hint">暫時未有紀錄</div></div>
                </div>

                <div class="panel control-bar" style="grid-area: control;">
                    <div class="control-row">
                        <input type="text" id="video_url" placeholder="請輸入 YouTube 直播 Link...">
                        <input type="text" id="yt_api_key" placeholder="輸入 YouTube Data API Key...">
                        <input type="number" id="duration" placeholder="基本開台鐘數 (小時)" value="2" min="0.5" step="0.5">
                        <button type="button" id="startBtn" class="btn btn-primary">開始 / 換Link</button>
                        <button type="button" id="pauseBtn" class="btn btn-warning" style="display: none;">暫停</button>
                        <button type="button" id="cutoffBtn" class="btn btn-accent" style="display: none;">Cut Off 埋數</button>
                    </div>
                    <div class="control-row">
                        <input type="text" id="payme_name" placeholder="課金用戶名">
                        <input type="number" id="payme_amount" placeholder="金額 (HKD)">
                        <button type="button" id="addPaymeBtn" class="btn btn-teal">加入 PayMe 記錄</button>
                        <div class="total-amount-badge" id="totalAmountBox">Total：$HKD 0</div>
                    </div>
                </div>
            </div>

            <!-- ============ Record / Report ============ -->
            <div class="page-view" id="recordView" style="display: none;">
                <div class="record-header">
                    <div class="total-amount-badge" id="recordTotalAmount">Total：$HKD 0</div>
                </div>
                <div class="session-list" id="sessionListContainer"></div>
            </div>

            <!-- ============ Rule Setting ============ -->
            <div class="page-view" id="ruleView" style="display: none;">
                <div class="panel">
                    <h3>加鐘規則設定</h3>
                    <div class="rule-form">
                        <input type="number" id="ruleMin" placeholder="金額下限 ($)">
                        <input type="number" id="ruleMax" placeholder="金額上限 (留空=無上限)">
                        <input type="number" id="ruleInterval" placeholder="每 $ 幾多">
                        <input type="number" id="ruleHours" placeholder="加幾多小時" value="1">
                        <button type="button" id="addRuleBtn">新增規則</button>
                    </div>
                    <div id="ruleListContainer"><div class="empty-hint">未設定任何規則</div></div>
                </div>
            </div>

            <!-- ============ 輪盤 ============ -->
            <div class="page-view" id="wheelView" style="display: none;">
                <div class="wheel-toolbar">
                    <button type="button" id="addWheelBtn">新增輪盤</button>
                </div>
                <div id="wheelListContainer"><div class="empty-hint">未有任何輪盤，按上面「新增輪盤」開始</div></div>
            </div>
        </main>
    </div>

</body>
</html>
