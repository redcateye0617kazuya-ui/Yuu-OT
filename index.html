<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <title>加班台 Super Chat 記錄器</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #fff; text-align: center; padding-top: 30px; margin: 0; }
        .card { background: #1e1e1e; padding: 30px; border-radius: 12px; display: inline-block; box-shadow: 0 4px 20px rgba(0,0,0,0.6); width: 420px; text-align: left; }
        h2 { text-align: center; color: #ff4757; margin-top: 0; }
        label { font-size: 13px; color: #bbb; display: block; margin-top: 12px; font-weight: bold; }
        input[type="text"], input[type="date"] { width: 100%; padding: 10px; margin-top: 5px; border-radius: 6px; border: 1px solid #444; background: #2a2a2a; color: #fff; box-sizing: border-box; font-size: 14px; }
        button { background: #ff4757; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 15px; margin-top: 15px; }
        button:hover { opacity: 0.9; }
        .status { margin-top: 15px; color: #2ed573; font-size: 13px; text-align: center; background: #252525; padding: 8px; border-radius: 5px; }
        .timer-box { background: #252525; padding: 12px; border-radius: 6px; text-align: center; margin-top: 15px; border: 1px solid #333; }
        .timer-box span { font-size: 18px; color: #ffa502; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>加班台控制台</h2>
        
        <form method="POST" action="/update_config">
            <label>YouTube 直播 Link：</label>
            <input type="text" name="video_url" value="{{ video_url }}" placeholder="https://www.youtube.com/watch?v=..." required>
            
            <label>開始日期：</label>
            <input type="date" name="start_date" value="{{ start_date }}" required>
            
            <button type="submit" name="action" value="start" style="background: #2ed573;">🚀 Start 開始計時</button>
            <button type="submit" name="action" value="reset" style="background: #ffa502; margin-top: 8px;">🔄 重設狀態</button>
        </form>

        <div class="timer-box">
            <p style="margin: 0 0 5px 0; font-size: 12px; color: #888;">計時器狀態：</p>
            <span id="countdown">計算中...</span>
        </div>

        <div class="status">
            <p style="margin: 0;"><strong>狀態：</strong>{{ chat_status }}</p>
        </div>
    </div>

    <script>
        const isStarted = {{ is_started }};
        const hoursToAdd = 4.5; // 固定 4.5 小時

        function updateTimer() {
            const countdownElem = document.getElementById("countdown");

            if (!isStarted) {
                countdownElem.innerHTML = "⏸️ 尚未按 Start，等待中...";
                return;
            }

            const now = new Date().getTime();
            // 以禁 Start 嗰一刻開始計，加上 4.5 小時作為目標結束時間
            if (!window.targetEndTime) {
                window.targetEndTime = now + (hoursToAdd * 60 * 60 * 1000);
            }

            const distance = window.targetEndTime - now;

            if (distance < 0) {
                countdownElem.innerHTML = "⏰ 倒數時間已結束！";
            } else {
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);
                countdownElem.innerHTML = `⏳ 倒數 ${hours}時 ${minutes}分 ${seconds}秒`;
            }
        }

        setInterval(updateTimer, 1000);
        updateTimer();
    </script>
</body>
</html>
